<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Голосование за меню</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --accent: #3f6b4a;
    --accent-soft: #eaf1ec;
    --heading-font: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #1c1c1c);
    padding: 28px 20px 100px;
    line-height: 1.45;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-family: var(--heading-font);
    font-weight: 400;
    font-size: 26px;
    margin: 0 0 6px;
  }
  .sub {
    color: var(--tg-theme-hint-color, #8a8a8a);
    font-size: 14px;
    margin: 0 0 8px;
  }
  .rule {
    border: none;
    border-top: 1px solid var(--tg-theme-hint-color, #e2e2e2);
    opacity: 0.5;
    margin: 20px 0 24px;
  }
  section { margin-bottom: 28px; }
  h2 {
    font-family: var(--heading-font);
    font-size: 18px;
    font-weight: 400;
    font-style: italic;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .optional-tag {
    font-size: 11px;
    color: var(--tg-theme-hint-color, #999);
    margin: 0 0 12px;
  }
  .dish-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    border: 1px solid var(--tg-theme-hint-color, #e2e2e2);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    background: var(--tg-theme-bg-color, #ffffff);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dish-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .dish-card.unavailable { opacity: 0.45; cursor: not-allowed; }
  .dish-emoji { font-size: 26px; line-height: 1; flex-shrink: 0; margin-top: 2px; }
  .dish-name { font-size: 14px; font-weight: 500; margin: 0 0 2px; }
  .dish-desc { font-size: 12px; color: var(--tg-theme-hint-color, #8a8a8a); margin: 0; }
  .unavailable-label { font-size: 11px; color: #c0392b; font-weight: 500; margin: 2px 0 0; }
  label.notes-label {
    display: block; font-family: var(--heading-font); font-size: 18px; font-style: italic;
    color: var(--accent); margin-bottom: 10px;
  }
  textarea {
    width: 100%; min-height: 56px; border-radius: 12px;
    border: 1px solid var(--tg-theme-hint-color, #d8d8d8);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #1c1c1c);
    padding: 12px 14px; font-size: 15px; font-family: inherit; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .error { color: #c0392b; font-size: 13px; margin-top: 4px; display: none; }
  .footnote { font-size: 12px; color: var(--tg-theme-hint-color, #999); text-align: center; margin-top: 8px; }
  .doneness-panel { padding: 4px 8px 10px 46px; margin: -8px 0 8px; }
  .doneness-label { font-size: 12px; color: var(--tg-theme-hint-color, #8a8a8a); margin: 6px 0 6px; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .pill {
    border: 1px solid var(--tg-theme-hint-color, #d8d8d8); color: var(--tg-theme-text-color, #1c1c1c);
    background: transparent; border-radius: 16px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .pill.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .loading { text-align: center; padding: 60px 20px; color: var(--tg-theme-hint-color, #999); }
  .empty-note { font-size: 12px; color: var(--tg-theme-hint-color, #999); font-style: italic; }
</style>
</head>
<body>
  <div id="loading" class="loading">Готовим сегодняшнее меню…</div>
  <div id="app" style="display:none">
    <p class="kicker">Голосование за меню</p>
    <h1 id="greeting">За что голосуем на завтра?</h1>
    <p class="sub">Меню сегодня придумано под то, что реально есть на кухне — выбери по одному варианту в каждом разделе, побеждают самые популярные.</p>
    <hr class="rule">
    <div id="sections"></div>
    <section>
      <label class="notes-label" for="notes">Комментарии</label>
      <textarea id="notes" placeholder="Аллергии, нелюбимые продукты, гости и т.д. (необязательно)"></textarea>
    </section>
    <p class="footnote">Все блюда в меню без глютена</p>
  </div>

<script>
  const API_BASE_URL = 'https://family-meal-bot-er5p.onrender.com';

  // Порядок, подписи, обязательность и эмодзи для каждой категории.
  // required относится только к "main" на завтрак и "main"/"side" на ужин —
  // остальное необязательно.
  const CATEGORY_CONFIG = {
    breakfast: [
      { key: 'main', label: 'Основное', required: true, emoji: '🍳' },
      { key: 'meat', label: 'Мясное блюдо', required: true, emoji: '🍗' },
      { key: 'cold_starter', label: 'Холодные закуски (завтрак)', required: false, emoji: '🥗' },
      { key: 'hot_starter', label: 'Горячие закуски (завтрак)', required: false, emoji: '🥑' },
      { key: 'side', label: 'Гарнир на завтрак', required: false, emoji: '🥔' },
      { key: 'soup', label: 'Суп на завтрак', required: false, emoji: '🍲' },
      { key: 'sauce', label: 'Соус (завтрак)', required: false, emoji: '🥣' },
      { key: 'dessert', label: 'Десерт на завтрак', required: false, emoji: '🍎' },
    ],
    dinner: [
      { key: 'starter', label: 'Холодные закуски', required: false, emoji: '🥗' },
      { key: 'hot_starter', label: 'Горячие закуски', required: false, emoji: '🥑' },
      { key: 'soup', label: 'Суп', required: false, emoji: '🍲' },
      { key: 'main', label: 'Основное блюдо', required: true, emoji: '🍽' },
      { key: 'side', label: 'Гарнир', required: true, emoji: '🥔' },
      { key: 'sauce', label: 'Соус', required: false, emoji: '🥣' },
      { key: 'dessert', label: 'Десерт', required: false, emoji: '🍎' },
    ],
  };

  const EGG_OPTIONS = ["Жидкий желток", "Средний желток", "Полностью готовый"];
  const MEAT_OPTIONS = ["С кровью", "Слабой прожарки", "Средней прожарки", "Почти прожаренное", "Полностью прожаренное"];

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    const name = tg.initDataUnsafe?.user?.first_name;
    if (name) document.getElementById('greeting').textContent = `За что голосуем на завтра, ${name}?`;
  }

  const selection = {}; // "breakfast.main" -> dishId, "dinner.side" -> dishId, etc.
  const donenessPrefs = {}; // dishId -> {egg?, meat?}
  let unavailableIds = new Set();

  function buildPillRow(dishId, kind, options, panel) {
    const label = document.createElement('p');
    label.className = 'doneness-label';
    label.textContent = kind === 'egg' ? 'Как приготовить яйцо' : 'Прожарка мяса';
    panel.appendChild(label);
    const row = document.createElement('div');
    row.className = 'pill-row';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pill';
      btn.textContent = opt;
      btn.onclick = () => {
        donenessPrefs[dishId] = donenessPrefs[dishId] || {};
        donenessPrefs[dishId][kind] = opt;
        [...row.children].forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      };
      row.appendChild(btn);
    });
    panel.appendChild(row);
  }

  function renderCategory(meal, cat, dishes) {
    const section = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = cat.label;
    section.appendChild(h2);
    if (!cat.required) {
      const tag = document.createElement('p');
      tag.className = 'optional-tag';
      tag.textContent = 'Необязательно';
      section.appendChild(tag);
    }

    const selKey = `${meal}.${cat.key}`;
    const listDiv = document.createElement('div');

    if (!dishes || dishes.length === 0) {
      const note = document.createElement('p');
      note.className = 'empty-note';
      note.textContent = 'Сегодня в этой категории нечего предложить — пропускаем.';
      listDiv.appendChild(note);
    } else {
      const cards = [];
      dishes.forEach(dish => {
        const isUnavailable = unavailableIds.has(dish.id);
        const card = document.createElement('div');
        card.className = 'dish-card' + (isUnavailable ? ' unavailable' : '');
        card.dataset.id = dish.id;
        card.innerHTML = `
          <div class="dish-emoji">${cat.emoji}</div>
          <div>
            <p class="dish-name">${dish.name}</p>
            <p class="dish-desc">${dish.description || ''}</p>
            ${isUnavailable ? '<p class="unavailable-label">Нет нужных продуктов</p>' : ''}
          </div>
        `;

        let panel = null;
        if (dish.customize && dish.customize.length) {
          panel = document.createElement('div');
          panel.className = 'doneness-panel';
          panel.style.display = 'none';
          if (dish.customize.includes('egg')) buildPillRow(dish.id, 'egg', EGG_OPTIONS, panel);
          if (dish.customize.includes('meat')) buildPillRow(dish.id, 'meat', MEAT_OPTIONS, panel);
        }

        if (!isUnavailable) {
          card.onclick = () => {
            const already = selection[selKey] === dish.id;
            cards.forEach(c => { c.card.classList.remove('selected'); if (c.panel) c.panel.style.display = 'none'; });
            if (already) {
              delete selection[selKey];
            } else {
              selection[selKey] = dish.id;
              card.classList.add('selected');
              if (panel) panel.style.display = 'block';
            }
          };
        }
        listDiv.appendChild(card);
        if (panel) listDiv.appendChild(panel);
        cards.push({ card, panel });
      });
    }

    section.appendChild(listDiv);

    if (cat.required) {
      const err = document.createElement('p');
      err.className = 'error';
      err.id = `err_${meal}_${cat.key}`;
      err.textContent = `Выбери вариант в разделе «${cat.label}»`;
      section.appendChild(err);
    }

    document.getElementById('sections').appendChild(section);
  }

  async function loadTodayMenu() {
    try {
      const [menuRes, availRes] = await Promise.all([
        fetch(`${API_BASE_URL}/menu-today`),
        fetch(`${API_BASE_URL}/availability`),
      ]);
      const menu = menuRes.ok ? await menuRes.json() : { breakfast: {}, dinner: {} };
      const avail = availRes.ok ? await availRes.json() : { unavailable: [] };
      unavailableIds = new Set(avail.unavailable || []);
      return menu;
    } catch (e) {
      return { breakfast: {}, dinner: {} };
    }
  }

  loadTodayMenu().then(menu => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    for (const meal of ['breakfast', 'dinner']) {
      for (const cat of CATEGORY_CONFIG[meal]) {
        renderCategory(meal, cat, (menu[meal] && menu[meal][cat.key]) || []);
      }
    }
  });

  function pickWithDoneness(dishId) {
    if (!dishId) return null;
    const prefs = donenessPrefs[dishId];
    return prefs ? { id: dishId, ...prefs } : { id: dishId };
  }

  function submit() {
    let ok = true;
    for (const meal of ['breakfast', 'dinner']) {
      for (const cat of CATEGORY_CONFIG[meal]) {
        if (!cat.required) continue;
        const err = document.getElementById(`err_${meal}_${cat.key}`);
        if (!selection[`${meal}.${cat.key}`]) {
          if (err) err.style.display = 'block';
          ok = false;
        } else if (err) {
          err.style.display = 'none';
        }
      }
    }
    if (!ok) return;

    const payload = { type: 'menu', breakfast: {}, dinner: {} };
    for (const meal of ['breakfast', 'dinner']) {
      for (const cat of CATEGORY_CONFIG[meal]) {
        payload[meal][cat.key] = pickWithDoneness(selection[`${meal}.${cat.key}`]);
      }
    }
    payload.notes = document.getElementById('notes').value.trim();

    if (tg) {
      tg.sendData(JSON.stringify(payload));
    } else {
      alert('Открой это внутри Telegram, чтобы отправить голос');
    }
  }

  if (tg) {
    tg.MainButton.setText('Проголосовать');
    tg.MainButton.show();
    tg.MainButton.onClick(submit);
  }
</script>
</body>
</html>
