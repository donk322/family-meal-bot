<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Stock</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --accent: #3f6b4a;
    --accent-soft: #eaf1ec;
    --heading-font: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #1c1c1c);
    padding: 28px 20px 100px;
    line-height: 1.4;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-family: var(--heading-font);
    font-weight: 400;
    font-size: 24px;
    margin: 0 0 6px;
  }
  .sub {
    color: var(--tg-theme-hint-color, #8a8a8a);
    font-size: 14px;
    margin: 0 0 18px;
  }
  #search {
    width: 100%;
    border-radius: 12px;
    border: 1px solid var(--tg-theme-hint-color, #d8d8d8);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #1c1c1c);
    padding: 10px 14px;
    font-size: 15px;
    margin-bottom: 16px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--tg-theme-hint-color, #ececec);
  }
  .row-name { font-size: 14px; }
  .row-unit { color: var(--tg-theme-hint-color, #999); font-size: 12px; }
  .row-current { color: var(--tg-theme-hint-color, #999); font-size: 11px; display: block; }
  .row input {
    width: 84px;
    text-align: right;
    border-radius: 8px;
    border: 1px solid var(--tg-theme-hint-color, #d8d8d8);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #1c1c1c);
    padding: 8px 10px;
    font-size: 14px;
  }
  .row input:focus { outline: none; border-color: var(--accent); }
  .hint {
    font-size: 12px;
    color: var(--tg-theme-hint-color, #999);
    margin-top: 16px;
    text-align: center;
  }
  .loading { text-align: center; padding: 60px 20px; color: var(--tg-theme-hint-color, #999); }
</style>
</head>
<body>
  <div id="loading" class="loading">Loading current stock…</div>
  <div id="app" style="display:none">
    <p class="kicker">Kitchen Stock</p>
    <h1>What's in the kitchen right now?</h1>
    <p class="sub">Enter what you have after a shopping trip. Leave blank fields untouched — only filled-in ones will update.</p>

    <input type="text" id="search" placeholder="Search for an item...">
    <div id="list"></div>
    <p class="hint">Only fill in what you actually counted — everything else stays as it was</p>
  </div>

<script>
  const API_BASE_URL = 'https://family-meal-bot-er5p.onrender.com';

  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  let ITEMS = [];
  const values = {};

  async function loadCurrentStock() {
    try {
      const res = await fetch(`${API_BASE_URL}/current-stock`);
      const data = res.ok ? await res.json() : { items: [] };
      return data.items || [];
    } catch (e) {
      return [];
    }
  }

  function renderList(filter) {
    const list = document.getElementById('list');
    list.innerHTML = '';
    ITEMS
      .filter(i => !filter || i.display.toLowerCase().includes(filter.toLowerCase()))
      .forEach(item => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <div>
            <span class="row-name">${item.display}</span>
            <span class="row-unit"> (${item.unit})</span>
            <span class="row-current">currently: ${item.current} ${item.unit}</span>
          </div>
          <input type="number" min="0" step="any" inputmode="decimal"
                 value="${values[item.key] ?? ''}" data-key="${item.key}">
        `;
        const input = row.querySelector('input');
        input.oninput = () => {
          if (input.value === '') delete values[item.key];
          else values[item.key] = parseFloat(input.value);
        };
        list.appendChild(row);
      });
  }

  loadCurrentStock().then(items => {
    ITEMS = items;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderList('');
  });

  document.getElementById('search').oninput = (e) => renderList(e.target.value);

  const EN_TO_RU_UNIT = { g: "г", kg: "кг", ml: "мл", l: "л", pcs: "шт" };

  function submit() {
    const stock = {};
    for (const key in values) {
      const item = ITEMS.find(i => i.key === key);
      if (!item) continue;
      // Отправляем боту тот же key (внутреннее имя) — он сам знает, какой
      // единицей это хранить. Единицу конвертируем обратно, если ключ был
      // известным русским продуктом (у него всегда была русская единица).
      stock[key] = { amount: values[key], unit: item.unit };
    }
    const payload = { type: 'stock', stock };
    if (tg) {
      tg.sendData(JSON.stringify(payload));
    } else {
      alert('Open this inside Telegram to send your update');
    }
  }

  if (tg) {
    tg.MainButton.setText('Save Stock Levels');
    tg.MainButton.show();
    tg.MainButton.onClick(submit);
  }
</script>
</body>
</html>
