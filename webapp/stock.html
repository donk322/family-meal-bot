<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Stock</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --accent: #3f6b4a;
    --accent-soft: #eaf1ec;
    --heading-font: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #1c1c1c);
    padding: 28px 20px 100px;
    line-height: 1.4;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-family: var(--heading-font);
    font-weight: 400;
    font-size: 24px;
    margin: 0 0 6px;
  }
  .sub {
    color: var(--tg-theme-hint-color, #8a8a8a);
    font-size: 14px;
    margin: 0 0 18px;
  }
  #search {
    width: 100%;
    border-radius: 12px;
    border: 1px solid var(--tg-theme-hint-color, #d8d8d8);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #1c1c1c);
    padding: 10px 14px;
    font-size: 15px;
    margin-bottom: 16px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--tg-theme-hint-color, #ececec);
  }
  .row-name {
    font-size: 14px;
  }
  .row-unit {
    color: var(--tg-theme-hint-color, #999);
    font-size: 12px;
  }
  .row input {
    width: 84px;
    text-align: right;
    border-radius: 8px;
    border: 1px solid var(--tg-theme-hint-color, #d8d8d8);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #1c1c1c);
    padding: 8px 10px;
    font-size: 14px;
  }
  .row input:focus { outline: none; border-color: var(--accent); }
  .hint {
    font-size: 12px;
    color: var(--tg-theme-hint-color, #999);
    margin-top: 16px;
    text-align: center;
  }
</style>
</head>
<body>
  <p class="kicker">Kitchen Stock</p>
  <h1>What's in the kitchen right now?</h1>
  <p class="sub">Enter what you have after a shopping trip. Leave blank fields untouched — only filled-in ones will update.</p>

  <input type="text" id="search" placeholder="Search for an item...">
  <div id="list"></div>
  <p class="hint">Only fill in what you actually counted — everything else stays as it was</p>

<script>
  // "ru" is the internal key the bot uses (must match dishes.json exactly) —
  // "en" and "unitEn" are just what's shown on screen to the cook.
  const INGREDIENTS = [
    {"ru": "авокадо", "en": "Avocado", "unitEn": "g"},
    {"ru": "банан", "en": "Banana", "unitEn": "g"},
    {"ru": "безглютеновый хлеб", "en": "Gluten-free bread", "unitEn": "pcs"},
    {"ru": "безглютеновый хлеб (на панировку)", "en": "Gluten-free bread (for breadcrumbs)", "unitEn": "g"},
    {"ru": "бекон", "en": "Bacon", "unitEn": "g"},
    {"ru": "болгарский перец", "en": "Bell pepper", "unitEn": "g"},
    {"ru": "ветчина", "en": "Ham", "unitEn": "g"},
    {"ru": "говядина", "en": "Beef", "unitEn": "g"},
    {"ru": "говядина отварная", "en": "Boiled beef", "unitEn": "g"},
    {"ru": "говяжий стейк", "en": "Beef steak", "unitEn": "g"},
    {"ru": "говяжий фарш", "en": "Ground beef", "unitEn": "g"},
    {"ru": "горчица", "en": "Mustard", "unitEn": "g"},
    {"ru": "греческий йогурт", "en": "Greek yogurt", "unitEn": "g"},
    {"ru": "гречневая крупа", "en": "Buckwheat groats", "unitEn": "g"},
    {"ru": "зира", "en": "Cumin", "unitEn": "g"},
    {"ru": "йогурт натуральный", "en": "Plain yogurt", "unitEn": "g"},
    {"ru": "картофель", "en": "Potato", "unitEn": "g"},
    {"ru": "колбаски", "en": "Sausages", "unitEn": "g"},
    {"ru": "красный винный уксус", "en": "Red wine vinegar", "unitEn": "ml"},
    {"ru": "кукурузные тако-шеллы", "en": "Corn taco shells", "unitEn": "pcs"},
    {"ru": "куриное бедро", "en": "Chicken thigh", "unitEn": "g"},
    {"ru": "куриное филе", "en": "Chicken breast", "unitEn": "g"},
    {"ru": "лайм", "en": "Lime", "unitEn": "g"},
    {"ru": "лимон", "en": "Lemon", "unitEn": "g"},
    {"ru": "лимонный сок", "en": "Lemon juice", "unitEn": "ml"},
    {"ru": "лук репчатый", "en": "Onion", "unitEn": "g"},
    {"ru": "молоко", "en": "Milk", "unitEn": "ml"},
    {"ru": "морковь", "en": "Carrot", "unitEn": "g"},
    {"ru": "мёд", "en": "Honey", "unitEn": "g"},
    {"ru": "овощной бульон", "en": "Vegetable broth", "unitEn": "ml"},
    {"ru": "огурец", "en": "Cucumber", "unitEn": "g"},
    {"ru": "огурцы солёные", "en": "Pickled cucumbers", "unitEn": "g"},
    {"ru": "оливковое масло", "en": "Olive oil", "unitEn": "ml"},
    {"ru": "орегано", "en": "Oregano", "unitEn": "g"},
    {"ru": "паприка", "en": "Paprika", "unitEn": "g"},
    {"ru": "пармезан", "en": "Parmesan", "unitEn": "g"},
    {"ru": "петрушка", "en": "Parsley", "unitEn": "g"},
    {"ru": "помидор", "en": "Tomato", "unitEn": "g"},
    {"ru": "растительное масло", "en": "Vegetable oil", "unitEn": "ml"},
    {"ru": "рис", "en": "Rice", "unitEn": "g"},
    {"ru": "рис арборио", "en": "Arborio rice", "unitEn": "g"},
    {"ru": "рис длиннозёрный", "en": "Long-grain rice", "unitEn": "g"},
    {"ru": "розмарин", "en": "Rosemary", "unitEn": "g"},
    {"ru": "свежая зелень", "en": "Fresh herbs", "unitEn": "g"},
    {"ru": "свёкла", "en": "Beetroot", "unitEn": "g"},
    {"ru": "слабосолёный лосось", "en": "Lightly salted salmon", "unitEn": "g"},
    {"ru": "сливки", "en": "Cream", "unitEn": "ml"},
    {"ru": "сливочное масло", "en": "Butter", "unitEn": "g"},
    {"ru": "сметана", "en": "Sour cream", "unitEn": "ml"},
    {"ru": "соль", "en": "Salt", "unitEn": "g"},
    {"ru": "специи для тако", "en": "Taco seasoning", "unitEn": "g"},
    {"ru": "сыр твёрдый", "en": "Hard cheese", "unitEn": "g"},
    {"ru": "томатная паста", "en": "Tomato paste", "unitEn": "g"},
    {"ru": "укроп", "en": "Dill", "unitEn": "g"},
    {"ru": "уксус", "en": "Vinegar", "unitEn": "ml"},
    {"ru": "фасоль в томате", "en": "Baked beans (in tomato sauce)", "unitEn": "g"},
    {"ru": "филе белой рыбы", "en": "White fish fillet", "unitEn": "g"},
    {"ru": "филе лосося", "en": "Salmon fillet", "unitEn": "g"},
    {"ru": "цукини", "en": "Zucchini", "unitEn": "g"},
    {"ru": "чеснок", "en": "Garlic", "unitEn": "g"},
    {"ru": "чили хлопья", "en": "Chili flakes", "unitEn": "g"},
    {"ru": "чёрный перец", "en": "Black pepper", "unitEn": "g"},
    {"ru": "шампиньоны", "en": "Mushrooms", "unitEn": "g"},
    {"ru": "яблоко", "en": "Apple", "unitEn": "g"},
    {"ru": "ягоды", "en": "Berries", "unitEn": "g"},
    {"ru": "яйца", "en": "Eggs", "unitEn": "pcs"}
  ];

  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const list = document.getElementById('list');
  const values = {};

  function renderList(filter) {
    list.innerHTML = '';
    INGREDIENTS
      .filter(i => !filter || i.en.toLowerCase().includes(filter.toLowerCase()))
      .forEach(ing => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <div>
            <span class="row-name">${ing.en}</span>
            <span class="row-unit"> (${ing.unitEn})</span>
          </div>
          <input type="number" min="0" step="any" inputmode="decimal"
                 value="${values[ing.ru] ?? ''}" data-ru="${ing.ru}">
        `;
        const input = row.querySelector('input');
        input.oninput = () => {
          if (input.value === '') delete values[ing.ru];
          else values[ing.ru] = parseFloat(input.value);
        };
        list.appendChild(row);
      });
  }

  document.getElementById('search').oninput = (e) => renderList(e.target.value);
  renderList('');

  function submit() {
    const RU_UNIT = {"g": "г", "ml": "мл", "pcs": "шт"};
    const stock = {};
    for (const ru in values) {
      const meta = INGREDIENTS.find(i => i.ru === ru);
      stock[ru] = { amount: values[ru], unit: RU_UNIT[meta.unitEn] || meta.unitEn };
    }
    const payload = { type: 'stock', stock };
    if (tg) {
      tg.sendData(JSON.stringify(payload));
    } else {
      alert('Open this inside Telegram to send your update');
    }
  }

  if (tg) {
    tg.MainButton.setText('Save Stock Levels');
    tg.MainButton.show();
    tg.MainButton.onClick(submit);
  }
</script>
</body>
</html>
